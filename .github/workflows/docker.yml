name: Docker Compose Build

on:
  push:
  pull_request:

jobs:
  docker:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start services
        run: docker compose -f docker/docker-compose.yml up --build -d

      - name: Validate running services
        run: |
          docker compose -f docker/docker-compose.yml ps
          docker compose -f docker/docker-compose.yml ps server | grep -Eqi 'running|up'
          docker compose -f docker/docker-compose.yml ps web | grep -Eqi 'running|up'

      - name: Show server logs
        if: always()
        run: docker compose -f docker/docker-compose.yml logs server

      - name: Show web logs
        if: always()
        run: docker compose -f docker/docker-compose.yml logs web

      - name: Shutdown stack
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v
