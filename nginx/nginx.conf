server {
  listen 80;
  server_name _;

  # Allow large headers/cookies from the API (e.g., auth cookies)
  large_client_header_buffers 8 64k;

  # Static files (Vite build)
  root /usr/share/nginx/html;
  index index.html;

  # API proxy to Bun server (strip /api prefix)
  location /api/ {
    proxy_pass         http://server:3000/;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host $host;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # Buffer settings to handle large response headers (e.g., cookies)
    proxy_buffer_size          64k;
    proxy_buffers              16 128k;
    proxy_busy_buffers_size    128k;
    proxy_temp_file_write_size 128k;
  }

  # Auth callbacks (served by the API server under /auth/*)
  location /auth/ {
    proxy_pass         http://server:3000/auth/;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host $host;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # Buffer settings to handle large response headers (e.g., cookies)
    proxy_buffer_size          64k;
    proxy_buffers              16 128k;
    proxy_busy_buffers_size    128k;
    proxy_temp_file_write_size 128k;
  }

  # History API fallback for SPA routes
  location / {
    try_files $uri $uri/ /index.html;
  }
}
