services:
  db:
    image: postgres:16-alpine
    container_name: flojoy_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: flojoy-cloud
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d flojoy-cloud"]
      interval: 5s
      timeout: 5s
      retries: 10
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: flojoy_server:local
    container_name: flojoy_server
    env_file:
      - ./apps/server/.env
    environment:
      DATABASE_URL: postgres://user:password@db:5432/flojoy-cloud
      PORT: 3000
      # IMPORTANT: set WEB_URI to the web host origin, e.g. http://192.168.1.20
      # You can also put this into apps/server/.env
      # WEB_URI: http://YOUR_WEB_HOST_IP
    depends_on:
      db:
        condition: service_healthy
    ports: ["3000:3000"]
    restart: unless-stopped

volumes:
  pgdata:
