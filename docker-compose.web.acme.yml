services:
  web_build:
    image: oven/bun:1
    container_name: flojoy_web_build
    working_dir: /repo
    command: sh -lc "bun install && cd apps/web && bun run build"
    volumes:
      - ./:/repo
    env_file:
      - ./apps/web/.env
    restart: "no"

  web:
    image: nginx:alpine
    container_name: flojoy_web
    depends_on:
      web_build:
        condition: service_completed_successfully
    volumes:
      - ./apps/web/dist:/usr/share/nginx/html:ro
      - ./apps/web/nginx.acme.conf:/etc/nginx/http.d/default.conf:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    # Publish HTTP on 5173; ACME HTTP-01 not applicable when using NPM DNS-01
    ports:
      - "5173:80"
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    container_name: flojoy_certbot
    volumes:
      - ./nginx/letsencrypt:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c"]
    # Run commands manually via `docker compose run --rm certbot <command>`
    command: "sleep infinity"
