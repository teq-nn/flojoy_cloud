services:
  web_build:
    image: oven/bun:1
    container_name: flojoy_web_build
    working_dir: /repo
    command: sh -lc "bun install && cd apps/web && bun run build"
    volumes:
      - ./:/repo
    env_file:
      - ./apps/web/.env
    restart: "no"

  web:
    image: nginx:alpine
    container_name: flojoy_web
    depends_on:
      web_build:
        condition: service_completed_successfully
    volumes:
      - ./apps/web/dist:/usr/share/nginx/html:ro
      - ./apps/web/nginx.tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

