services:
  web_build:
    image: oven/bun:1
    container_name: flojoy_web_build
    # Install at monorepo root to dedupe workspace deps (elysia)
    working_dir: /repo
    command: sh -lc "bun install && cd apps/web && bun run build"
    volumes:
      - ./:/repo
    # Provide VITE_SERVER_URL via apps/web/.env (recommended) or uncomment env_file
    env_file:
      - ./apps/web/.env
    restart: "no"

  web:
    image: nginx:alpine
    container_name: flojoy_web
    depends_on:
      web_build:
        condition: service_completed_successfully
    volumes:
      - ./apps/web/dist:/usr/share/nginx/html:ro
      - ./apps/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # Expose on 5173 to avoid colliding with host nginx/NPM on :80
    ports: ["5173:80"]
    restart: unless-stopped
